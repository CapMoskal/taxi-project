name: CI

# Backstop for what lands on main, not a PR gate — this repo doesn't use
# GitHub PRs (feature branches stay local, merged locally before push), so
# the only thing to protect is main itself. See docs/decisions.md.
on:
  push:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --force bypasses npm's platform check for @oxlint/binding-darwin-arm64
      # (a deliberate macOS-only devDependency, see _archive/decisions-scaffold.md)
      # — same fix as vercel.json's installCommand, same underlying problem.
      - run: npm install --force

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm run lint

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
